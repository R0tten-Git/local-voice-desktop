<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>LocalVoice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M12 4v10" /><path d="M8 7v4" /><path d="M16 7v4" /><path d="M5 10v2" /><path d="M19 10v2" />
        </svg>
      </span>
      <span class="wordmark">LocalVoice</span>

      <div class="wave" id="wave" aria-hidden="true"></div>

      <select id="model" title="识别模型"></select>
    </header>

    <section id="setup" class="setup hidden">
      <div id="envBlock" class="card env hidden">
        <div class="card-head">
          <strong>先准备运行环境</strong>
          <span class="tag" id="envSize">Python 运行时</span>
        </div>
        <p class="hint">只需一次。装到 <code id="envPath">应用私有目录</code>，不动系统 Python。</p>
        <div class="actions">
          <button id="installEnv" class="solid">安装环境</button>
        </div>
        <pre id="envLog" class="shell hidden"></pre>
      </div>

      <div class="card">
        <div class="card-head">
          <strong>还没有可用的模型</strong>
          <span class="tag">首次使用需下载</span>
        </div>
        <div id="recommend" class="recommend"></div>
        <div class="actions">
          <button id="download" class="solid">下载并安装</button>
          <button id="openModels" class="quiet">打开文件夹</button>
          <button id="copyCmd" class="quiet">复制命令</button>
        </div>
        <div class="bar hidden" id="bar"><div class="bar-fill" id="barFill"></div></div>
        <div id="dlText" class="hint"></div>
        <pre id="cmd" class="shell"></pre>
      </div>
    </section>

    <main id="transcript" class="transcript" aria-live="polite"></main>

    <div class="dock">
      <button id="toggle" class="rec" title="开始录音" aria-label="开始录音">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path class="i-play" d="M8.5 5.2v13.6L19.3 12z" />
          <rect class="i-pause" x="7" y="5" width="3.4" height="14" rx="1.1" />
          <rect class="i-pause" x="13.6" y="5" width="3.4" height="14" rx="1.1" />
        </svg>
      </button>

      <div class="readout">
        <span id="state" class="state">就绪</span>
        <span id="stats" class="stats">0 字</span>
      </div>

      <div class="tools">
        <button id="copy" class="icon" title="复制全文">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/></svg>
        </button>
        <button id="save" class="icon" title="保存为 Markdown">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11"/><path d="m7.5 10 4.5 4.5L16.5 10"/><path d="M4.5 19.5h15"/></svg>
        </button>
        <button id="clear" class="icon" title="清空">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9.5 7V4.8h5V7"/><path d="M6.5 7l.9 12.2h9.2L17.5 7"/></svg>
        </button>
      </div>

      <div class="level" id="level"><div class="level-fill" id="levelFill"></div></div>
    </div>

    <div id="diag" class="diag"></div>

    <script src="app.js"></script>
  </body>
</html>
